<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Le Cinéma de Aymen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CinéAymen">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3176/3176311.png">
    
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --text-color: white;
            --card-bg: #1e1e1e;
            --primary-color: #e50914;
            --shadow-color: rgba(0,0,0,0.5);
        }

        .light-mode {
            --bg-color: #f4f4f4;
            --text-color: #121212;
            --card-bg: #ffffff;
            --shadow-color: rgba(0,0,0,0.1);
        }

        /* --- Mode Ambiance Salle (Ultra Sombre) --- */
        .cinema-mode {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --card-bg: #101010;
            --shadow-color: rgba(229, 9, 20, 0.25);
            background-image: radial-gradient(circle at center, #1a0304 0%, #050505 100%);
        }

        .cinema-mode .film-card {
            box-shadow: 0 0 20px var(--shadow-color);
            border-color: #380608;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.5s ease, color 0.3s ease;
        }

        h1 { text-align: center; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px; margin-top: 60px; }

        #top-bar {
            position: fixed; top: 10px; right: 10px;
            display: flex; gap: 10px; z-index: 1000;
            align-items: center;
        }

        #status, #userMenu, #btn-ambiance { padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; border: none; }
        #status { background: #28a745; color: white; }
        #userMenu { background: var(--primary-color); color: white; }
        #btn-ambiance { background: #333; color: white; transition: 0.3s; }

        /* Conteneur des Boutons PWA & Widget */
        .pwa-widget-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: -20px auto 25px auto;
            max-width: 500px;
            padding: 0 20px;
        }
        .btn-pwa-feature {
            flex: 1;
            width: auto;
            padding: 10px 15px;
            font-size: 0.85rem;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-pwa-feature:active { transform: scale(0.96); }

        .container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; padding: 20px;
        }

        .film-card {
            background: var(--card-bg); border-radius: 15px; overflow: hidden;
            border: 1px solid #333; box-shadow: 0 10px 20px var(--shadow-color);
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;
            transform: perspective(1000px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .film-card img { width: 100%; height: 380px; object-fit: cover; }
        .info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { margin: 0 0 10px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .btn-trailer { background: #333; color: #fff; border: 1px solid #555; }
        .btn-trailer:hover { background: #444; }

        /* Animation d'urgence douce pour inciter à la réservation (Badge Clignotant) */
        @keyframes pulseUrgent {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); box-shadow: 0 0 10px rgba(253, 126, 20, 0.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        .pulse-warning {
            display: inline-block;
            animation: pulseUrgent 1.8s infinite ease-in-out;
        }

        /* Onglets Espace Client */
        .tabs-header {
            display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #eee; color: #555; transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--primary-color); color: white;
        }

        /* --- Squelettes de Chargement (Skeleton Loader) --- */
        .skeleton-card {
            background: var(--card-bg); border-radius: 15px; overflow: hidden;
            height: 530px; display: flex; flex-direction: column; border: 1px solid #333;
        }
        .skeleton-img {
            width: 100%; height: 380px;
            background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
            background-size: 200% 100%; animation: loadingSkeleton 1.5s infinite;
        }
        .skeleton-text {
            height: 20px; margin: 15px; border-radius: 4px;
            background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
            background-size: 200% 100%; animation: loadingSkeleton 1.5s infinite;
        }
        @keyframes loadingSkeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- Borne Automatique & Fente de Ticket --- */
        .ticket-slot {
            position: relative;
            background: #222;
            padding: 20px 10px 10px 10px;
            border-radius: 8px;
            box-shadow: inset 0 8px 10px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.3);
            overflow: hidden;
            margin-top: 15px;
            perspective: 1000px;
            transition: box-shadow 0.3s ease;
        }
        .ticket-slot::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%; height: 6px;
            background: #000;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 2px 5px rgba(255,255,255,0.1);
            z-index: 2;
        }

        /* Animation de secousse physique pour la fente de la borne (Impression) */
        @keyframes shakeSlot {
            0% { transform: scale(1) translate(0, 0); }
            10% { transform: scale(1.02) translate(-1px, -1px); }
            30% { transform: scale(1.01) translate(1px, 1px); }
            50% { transform: scale(1) translate(-1px, 1px); }
            70% { transform: scale(1.01) translate(1px, -1px); }
            90% { transform: scale(1) translate(-1px, -1px); }
            100% { transform: scale(1) translate(0, 0); }
        }
        .ticket-slot.printing {
            animation: shakeSlot 0.6s ease-in-out;
            box-shadow: inset 0 8px 10px rgba(0,0,0,0.8), 0 4px 20px rgba(229, 9, 20, 0.4);
        }

        /* --- Design Ticket Rétro Dentelé & Texturé --- */
        .ticket-retro {
            background: #fff3cd;
            color: #332200;
            border: 2px dashed #b58105;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            transform-style: preserve-3d;
            
            background-image: 
                radial-gradient(circle at top left, transparent 12px, #fff3cd 13px),
                radial-gradient(circle at top right, transparent 12px, #fff3cd 13px),
                radial-gradient(circle at bottom left, transparent 12px, #fff3cd 13px),
                radial-gradient(circle at bottom right, transparent 12px, #fff3cd 13px),
                repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.015) 0px, rgba(0, 0, 0, 0.015) 2px, transparent 2px, transparent 4px);
            
            transform: translateY(-100%);
            animation: imprimerTicket 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 1;
        }

        @keyframes imprimerTicket {
            0% { transform: translateY(-100%) perspective(1000px) rotateX(0deg); opacity: 0; filter: brightness(0.7); }
            20% { opacity: 1; }
            100% { transform: translateY(0) perspective(1000px) rotateX(0deg); filter: brightness(1); }
        }

        .ticket-header {
            text-align: center;
            border-bottom: 2px dotted #b58105;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #745203;
        }
        .ticket-body table { width: 100%; border-collapse: collapse; }
        .ticket-body td { padding: 6px 0; border-bottom: 1px dashed rgba(181,129,5,0.2); }
        .ticket-footer {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-top: 2px dotted #b58105;
            padding-top: 15px;
        }
        .ticket-id { font-size: 0.75rem; color: #666; max-width: 120px; word-break: break-all; font-weight: bold; }

        /* Style du Bouton Officiel Apple Wallet */
        .btn-apple-wallet {
            display: inline-block;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Add_to_Apple_Wallet_rgb_090221.svg/320px-Add_to_Apple_Wallet_rgb_090221.svg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 140px;
            height: 42px;
            border: none;
            cursor: pointer;
            background-color: transparent;
            transition: transform 0.2s ease;
            margin-top: 5px;
        }
        .btn-apple-wallet:hover {
            transform: scale(1.04);
        }

        /* --- Espace Compte Modale --- */
        #mesBilletsContainer {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%,-50%); background: white; color: black;
            padding: 25px; border-radius: 15px; z-index: 101;
            width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .section-titre { border-bottom: 2px solid var(--primary-color); margin-top: 5px; font-weight: bold; color: var(--primary-color); font-size: 0.95em; padding-bottom: 3px; }
        .mini-ticket { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 0.9em; }
        .btn-action { border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; color: white; margin-left: 5px; font-weight: bold; }
        .btn-cancel { background: #dc3545; }
        .btn-view { background: #007bff; }

        /* --- Profil --- */
        #welcome-msg { text-align: center; margin-bottom: 20px; }
        #user-photo { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--primary-color); object-fit: cover; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; }
        
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: white; color: black; padding: 25px; border-radius: 15px; z-index: 101; width: 90%; max-width: 430px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .avatar-selection { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
        .avatar-option { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; object-fit: cover; }
        .avatar-option.selected { border-color: var(--primary-color); transform: scale(1.1); }

        #trailerModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: #000; padding: 10px; border-radius: 10px; z-index: 102; width: 90%; max-width: 560px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-secondary { background: #666; }
    </style>
</head>
<body>

    <div id="top-bar">
        <button id="btn-ambiance" onclick="toggleAmbiance()">💡 Éteindre</button>
        <div id="status">🟢</div>
        <div id="userMenu" onclick="toggleMesBillets()">👤 Mon Compte</div>
    </div>

    <div id="welcome-msg" style="display:none;">
        <img id="user-photo" src="">
        <h2 id="user-name"></h2>
        <button onclick="deconnexion()" class="btn-secondary" style="width:auto; padding: 5px 10px; font-size: 0.8rem; margin:0;">Déconnexion</button>
    </div>

    <h1>🍿 Le Cinéma de Aymen</h1>

    <div class="pwa-widget-bar">
        <button id="btn-pwa" class="btn-pwa-feature" style="display:none; background:#28a745;" onclick="installerPWA()">📲 Installer l'App</button>
        <button id="btn-widget" class="btn-pwa-feature" style="background:#fd7e14;" onclick="ouvrirConfigurationWidget()">📱 Ajouter le Widget</button>
    </div>

    <div class="container" id="filmsList"></div>

    <div id="mesBilletsContainer">
        <h2 style="text-align:center;">🎫 Mes Tickets de Cinéma</h2>
        
        <div class="tabs-header">
            <button id="btnTabActifs" class="tab-btn active" onclick="switchBilletTab('actifs')">🎟️ Mes Billets Actifs</button>
            <button id="btnTabHistorique" class="tab-btn" onclick="switchBilletTab('historique')">🎞️ Mon Historique</button>
        </div>

        <div id="panel-billets-actifs">
            <div id="billets-a-venir"></div>
        </div>
        
        <div id="panel-billets-historique" style="display:none; opacity:0.75;">
            <div id="billets-termines"></div>
        </div>
        
        <hr style="margin-top:20px; border: 0; border-top: 1px solid #eee;">
        <div style="text-align:center;">
            <p>⭐ <b>Votre avis compte :</b></p>
            <a href="https://forms.gle/pem7RA7ext9Lb6DQ7" target="_blank" style="color:var(--primary-color); font-weight:bold;">Donner mon avis</a>
            <button onclick="toggleMesBillets()" class="btn-secondary" style="margin-top:15px">Fermer mon espace</button>
        </div>
    </div>

    <div id="overlay" onclick="fermerTout()"></div>

    <div id="modal">
        <h2 id="modalTitle">Réserver</h2>
        <div id="reservation-form">
            <input type="number" id="codeClient" placeholder="Code Client (ex: 125, 147)" oninput="verifierCode()">
            <input type="text" id="nom" placeholder="Nom">
            <input type="text" id="prenom" placeholder="Prénom">
            <input type="email" id="email" placeholder="Adresse Email (Optionnel — Recevoir le billet)">
            
            <div style="text-align:left; font-size: 0.9em; margin-top: 10px; color: #444;">
                <label><b>Choisissez votre Avatar :</b></label>
                <div class="avatar-selection" id="avatarSelection">
                    <img src="https://cdn-icons-png.flaticon.com/512/6833/6833892.png" class="avatar-option selected" onclick="selectAvatar(this)" data-url="https://cdn-icons-png.flaticon.com/512/6833/6833892.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png" class="avatar-option" onclick="selectAvatar(this)" data-url="https://cdn-icons-png.flaticon.com/512/6997/6997662.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/4140/4140037.png" class="avatar-option" onclick="selectAvatar(this)" data-url="https://cdn-icons-png.flaticon.com/512/4140/4140037.png">
                    <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="avatar-option" onclick="selectAvatar(this)" data-url="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">
                </div>
            </div>

            <div style="text-align:left; font-size: 0.9em; margin: 10px 0; color: #444;">
                <label><input type="checkbox" id="snackOption" style="width:auto;"> 🍿 Snack à volonté inclus</label>
            </div>
            <button id="btnValidationModal" onclick="validerReservation()">Réserver ma place</button>
        </div>
        
        <div id="qrcode-container" style="display:none; margin-top:15px;"></div>
        
        <div id="postResBtns" style="display:none;"></div>
        <button onclick="fermerTout()" class="btn-secondary" style="margin-top:10px;">Fermer</button>
    </div>

    <div id="trailerModal">
        <div class="video-container">
            <iframe id="trailerFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <button onclick="fermerTrailer()" class="btn-secondary" style="margin-top:8px; padding:8px;">Fermer la vidéo</button>
    </div>

    <script>
        /* ========= ENREGISTREMENT DU SERVICE WORKER (PWA) ========= */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Enregistré avec succès ! Scope:', reg.scope))
                    .catch(err => console.error('Échec de l\'enregistrement du Service Worker:', err));
            });
        }

        /* ========= CONFIGURATIONS ET INITIALISATIONS ========= */
        emailjs.init({ publicKey: "0UMPQmNVTxL8v-Mu_" });

        const firebaseConfig = {
            apiKey: "AIzaSyC8wGq8dQ5CM8YuCIm_b8yySYtrW4ylSm4",
            authDomain: "cafe-djoudi.firebaseapp.com",
            projectId: "cafe-djoudi",
            storageBucket: "cafe-djoudi.firebasestorage.app",
            appId: "1:812537096039:web:7f9b79b34454360b73b1c2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentFilm = null;
        let modeAttente = false; 
        let selectedAvatarUrl = "https://cdn-icons-png.flaticon.com/512/6833/6833892.png";

        const heureActuelle = new Date().getHours();
        if(heureActuelle > 7 && heureActuelle < 19) document.body.classList.add('light-mode');

        window.addEventListener('DOMContentLoaded', () => {
            const savedCode = localStorage.getItem('codeClient');
            if (savedCode) {
                document.getElementById('codeClient').value = savedCode;
                verifierCode(true); 
            } else {
                const savedAvatar = localStorage.getItem('guestAvatar');
                if(savedAvatar) {
                    selectedAvatarUrl = savedAvatar;
                    mettreAJourSelectionAvatarGraphique(savedAvatar);
                }
            }
            
            // Masquer le bouton d'installation si l'app est déjà lancée en mode autonome standalone
            if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
                const pwaBtn = document.getElementById('btn-pwa');
                if(pwaBtn) pwaBtn.style.display = 'none';
            }
        });

        /* ========= GESTION DE L'INSTALLATION PWA (ANDROID & DESKTOP) ========= */
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            // Empêche le navigateur d'afficher la bannière par défaut
            e.preventDefault();
            deferredPrompt = e;
            // Rend notre bouton personnalisé visible
            const pwaBtn = document.getElementById('btn-pwa');
            if (pwaBtn) pwaBtn.style.display = 'inline-block';
        });

        function installerPWA() {
            if (!deferredPrompt) {
                alert("💡 Astuce iPhone / Safari :\n\nPour installer l'application sur votre écran d'accueil :\n1. Appuyez sur le bouton 'Partager' (carré avec la flèche vers le haut).\n2. Sélectionnez l'option 'Sur l'écran d'accueil'.");
                return;
            }
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('L\'utilisateur a accepté l\'installation de la PWA');
                    document.getElementById('btn-pwa').style.display = 'none';
                }
                deferredPrompt = null;
            });
        }

        /* ========= COMPAGNON COMPOSANT WIDGET ========= */
        function ouvrirConfigurationWidget() {
            const code = localStorage.getItem('codeClient') || "Non configuré";
            alert(`📱 Configuration du Widget Écran d'accueil :\n\n1. Pour intégrer l'accès rapide de vos billets sur l'écran d'accueil iOS (Scriptable) ou macOS, utilisez votre identifiant client.\n2. Statut actuel du profil de synchronisation : N° ${code}.\n\nVos billets actifs s'actualiseront automatiquement dans l'extension.`);
            console.log(`Widget Compagnon initialisé pour le codeClient : ${code}`);
        }

        /* ========= CONTRÔLE DE L'AMBIANCE VISUELLE ========= */
        function toggleAmbiance() {
            const body = document.body;
            const btn = document.getElementById('btn-ambiance');
            
            if (body.classList.contains('cinema-mode')) {
                body.classList.remove('cinema-mode');
                btn.innerText = "💡 Éteindre";
                btn.style.background = "#333";
            } else {
                body.classList.remove('light-mode');
                body.classList.add('cinema-mode');
                btn.innerText = "🍿 Mode Salle";
                btn.style.background = "#e50914";
            }
        }

        /* ========= SQUELETTES DE CHARGEMENT AMÉLIORÉS ========= */
        function afficherSquelettes() {
            const list = document.getElementById("filmsList");
            list.innerHTML = "";
            for (let i = 0; i < 3; i++) {
                list.innerHTML += `
                    <div class="skeleton-card">
                        <div class="skeleton-img"></div>
                        <div class="skeleton-text" style="width: 70%;"></div>
                        <div class="skeleton-text" style="width: 50%;"></div>
                    </div>`;
            }
        }
        afficherSquelettes();

        /* ========= SELECTION AVATARS ========= */
        function selectAvatar(element) {
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            element.classList.add('selected');
            selectedAvatarUrl = element.getAttribute('data-url');
            localStorage.setItem('guestAvatar', selectedAvatarUrl);
            
            if(document.getElementById('welcome-msg').style.display === "block") {
                document.getElementById('user-photo').src = selectedAvatarUrl;
            }
        }

        function mettreAJourSelectionAvatarGraphique(url) {
            document.querySelectorAll('.avatar-option').forEach(img => {
                if(img.getAttribute('data-url') === url) {
                    img.classList.add('selected');
                } else {
                    img.classList.remove('selected');
                }
            });
        }

        /* ========= VÉRIFICATION DES UTILISATEURS (VIP SYSTEM) ========= */
        function verifierCode(isAuto = false) {
            const code = document.getElementById('codeClient').value.trim();
            const profils = {

        /* ========= SYNTHÉTISEUR SONORE IMPRIMANTE THERMIQUE ========= */
        function simulerSonImprimante() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Génération d'un buffer de bruit blanc pur
                const bufferSize = audioCtx.sampleRate * 0.6; // Durée calée sur 0.6 secondes
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // Filtre pass-bande pour donner un grain mécanique / plastique métallique étouffé
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 3;

                // Gain nodal temporel pour simuler les lignes de hachage de la tête d'impression
                const gainNode = audioCtx.createGain();
                const t = audioCtx.currentTime;
                gainNode.gain.setValueAtTime(0, t);
                
                // Micro Saccades rythmiques (moteur pas-à-pas de l'imprimante à ticket)
                for(let i = 0; i < 0.6; i += 0.08) {
                    gainNode.gain.linearRampToValueAtTime(0.15, t + i);
                    gainNode.gain.linearRampToValueAtTime(0.01, t + i + 0.04);
                }
                gainNode.gain.setValueAtTime(0, t + 0.6);

                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                noise.start();
            } catch (e) {
                console.log("AudioContext bloqué ou non supporté par l'hôte.", e);
            }
        }

        /* ========= ACTIONS RÉSERVATIONS & LISTE D'ATTENTE ========= */
        async function validerReservation() {
            const n = document.getElementById('nom').value.trim();
            const p = document.getElementById('prenom').value.trim();
            const emailClient = document.getElementById('email').value.trim();
            const snack = document.getElementById('snackOption').checked;
            
            if (!n || !p) return alert("Votre Nom et Prénom sont obligatoires.");
            if (!currentFilm) return;

            localStorage.setItem('nomInvite', n);

            if(!localStorage.getItem('codeClient')) {
                document.getElementById('user-name').innerText = `Bienvenue ${p}`;
                document.getElementById('user-photo').src = selectedAvatarUrl;
                document.getElementById('welcome-msg').style.display = "block";
            }

            if (modeAttente) {
                try {
                    await db.collection("liste_attente").add({
                        nom: n, prenom: p, film: currentFilm.nom, snack: snack, avatar: selectedAvatarUrl, email: emailClient, timestamp: Date.now()
                    });
                    if(emailClient) envoyerEmailBillet(emailClient, p, currentFilm.nom, "FILE D'ATTENTE PRIORITAIRE ⏳");
                    alert("Enregistré sur la liste d'attente avec succès !");
                    fermerTout();
                } catch (error) { alert("Erreur d'inscription en file d'attente : " + error); }
                return;
            }

            const filmRef = db.collection("films").doc(currentFilm.id);
            try {
                const reservationId = await db.runTransaction(async (transaction) => {
                    const filmDoc = await transaction.get(filmRef);
                    if (!filmDoc.exists) throw "Le film n'existe pas.";

                    const filmData = filmDoc.data();
                    const limitPlaces = filmData.placesMax || 3;

                    const resQuery = await db.collection("reservations").where("film", "==", currentFilm.nom).get();
                    if (resQuery.size >= limitPlaces) throw "Désolé, la séance vient d'être complète.";

                    const newResRef = db.collection("reservations").doc();
                    transaction.set(newResRef, {
                        nom: n, prenom: p, film: currentFilm.nom, snack: snack, avatar: selectedAvatarUrl, email: emailClient, venu: false, timestamp: Date.now()
                    });
                    return newResRef.id;
                });

                if(emailClient) envoyerEmailBillet(emailClient, p, currentFilm.nom, reservationId);
                voirBillet(reservationId, currentFilm.nom, n, p, snack);

            } catch (error) { alert("Erreur : " + error); }
        }

        function ajouterAuCalendrier() {
            if (!currentFilm) return;
            const titreEvenement = `🎬 Séance : ${currentFilm.nom} - Le Cinéma de Aymen`;
            const description = `Votre place de cinéma privée est validée. Présentez votre QR Code d'accès à l'entrée.`;

            const maintenant = new Date().toISOString().replace(/-|:|\.\d\d\d/g, "");
            
            const dateDebut = new Date(); dateDebut.setHours(21, 0, 0);
            const dateDebutISO = dateDebut.toISOString().replace(/-|:|\.\d\d\d/g, "");
            const dateFin = new Date(dateDebut.getTime() + 2 * 60 * 60 * 1000); 
            const dateFinISO = dateFin.toISOString().replace(/-|:|\.\d\d\d/g, "");

            const icsContenu = [
                "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Le Cinema de Aymen//NONSGML v1.0//FR",

                `DESCRIPTION:${description}`, `LOCATION:${lieu}`, "END:VEVENT", "END:VCALENDAR"
            ].join("\r\n");

            document.body.appendChild(lien); lien.click(); document.body.removeChild(lien);
        }

        /* ========= EXPORT GENERATEUR PDF VINTAGE (jsPDF) ========= */
        async function downloadQR() {
            const { jsPDF } = window.jspdf;
            
            // Format Ticket vertical compact (100mm de large x 210mm de hauteur)
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: [100, 210] });

            const filmNom = currentFilm ? currentFilm.nom : "Film";
            const nom = document.getElementById('nom').value.trim() || "Inconnu";
            const prenom = document.getElementById('prenom').value.trim() || "Inconnu";
            const codeClient = document.getElementById('codeClient').value || "Public";
            const snackChecked = document.getElementById('snackOption').checked ? "Inclus (Popcorn)" : "Non inclus";
            const dateStr = new Date().toLocaleDateString('fr-FR');

            // --- 1. APPLAT COULEUR CREME RETRO & FINITIONS ---
            doc.setFillColor(255, 243, 205); // #fff3cd
            doc.rect(0, 0, 100, 210, "F");

            // Liseré pointillé marron intérieur
            doc.setDrawColor(181, 129, 5); // #b58105
            doc.setLineWidth(0.5);
            doc.setLineDashPattern([2, 1.5], 0);
            doc.rect(4, 4, 92, 202, "S");
            doc.setLineDashPattern([], 0); // Réinitialisation

            // --- 2. EXTRACTION ET INTEGRATION DE L'AFFICHE ---
            let yContenu = 120; 
            const cards = Array.from(document.querySelectorAll('.film-card'));
            let srcAffiche = null;
            
            cards.forEach(card => {
                const h3 = card.querySelector('h3');
                if(h3 && h3.innerText.trim().toLowerCase() === filmNom.trim().toLowerCase()) {
                    const img = card.querySelector('img');
                    if(img) srcAffiche = img.src;
                }
            });

            if (srcAffiche) {
                try {
                    // Inclusion nette de l'affiche de couverture (60mm x 85mm)
                    doc.addImage(srcAffiche, "JPEG", 20, 10, 60, 85);
                    
                    // Bordure pleine d'encadrement rétro
                    doc.setDrawColor(116, 82, 3);
                    doc.setLineWidth(0.7);
                    doc.rect(19.5, 9.5, 61, 86, "S");
                    yContenu = 104; 
                } catch(e) {
                    console.error("Erreur de rendu sur l'affiche du film.", e);
                    yContenu = 20; 
                }
            }

            // --- 3. MISE EN PAGE TYPE MACHINE A ÉCRIRE ---
            doc.setFont("courier", "bold");
            doc.setTextColor(116, 82, 3); // #745203
            doc.setFontSize(14);
            doc.text("LE CINEMA DE AYMEN", 50, yContenu, { align: "center" });
            
            doc.setLineWidth(0.4);
            doc.setDrawColor(181, 129, 5);
            doc.line(10, yContenu + 3, 90, yContenu + 3);

            doc.setFont("courier", "normal");
            doc.setFontSize(10);
            
            let currentY = yContenu + 10;
            const ecart = 7;

            const tableData = [
                { label: "FILM:", val: filmNom.toUpperCase() },
                { label: "SPECTATEUR:", val: `${prenom} ${nom}`.toUpperCase() },
                { label: "COMPTE VIP:", val: `N° ${codeClient}` },
                { label: "OPTION SNACK:", val: snackChecked.toUpperCase() },
                { label: "EMISSION:", val: dateStr }
            ];

            tableData.forEach(item => {
                doc.setFont("courier", "bold");
                doc.text(item.label, 12, currentY);
                doc.setFont("courier", "normal");
                doc.text(item.val, 88, currentY, { align: "right" });
                currentY += ecart;
            });

            doc.setLineDashPattern([1, 1], 0);
            doc.line(15, currentY + 2, 85, currentY + 2);
            doc.setLineDashPattern([], 0);

            // --- 4. INTEGRATION COMPOSANT INK QR CODE ---
            const qrImg = document.querySelector("#qr-ticket img");
            if (qrImg && qrImg.src) {
                doc.addImage(qrImg.src, "PNG", 35, currentY + 6, 30, 30);
                
                doc.setFont("courier", "bold");
                doc.setFontSize(7);
                doc.setTextColor(150, 150, 150);
                doc.text(`TICKET ID: ${currentFilm.id}`, 50, currentY + 41, { align: "center" });
            }

            const cleanFileName = `ticket-${filmNom.replace(/\s+/g, '-').toLowerCase()}.pdf`;
            doc.save(cleanFileName);
        }
