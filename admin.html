<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - Cinéma de Aymen</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f111a;
            color: #e2e8f0;
            padding: 20px;
            margin: 0;
        }
        h1, h2 { color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        h1 { text-align: center; color: #e50914; margin-bottom: 30px; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        section {
            background: #1a1d29;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 1px solid #2d3142;
        }
        
        input, button, select {
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        
        input, select {
            background: #282a36;
            border: 1px solid #44475a;
            color: #fff;
        }
        
        button {
            background: #e50914;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #b80710; }
        
        .btn-sm { width: auto; padding: 6px 12px; margin: 2px; font-size: 0.85rem; }
        .btn-red { background: #dc3545; }
        .btn-red:hover { background: #bd2130; }
        .btn-orange { background: #fd7e14; }
        .btn-orange:hover { background: #e06302; }
        
        /* Zone de Scan */
        #reader { border-radius: 8px; overflow: hidden; border: none !important; }
        #scanResult {
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
            background: #282a36;
        }
        .scan-valide { background: #27a745 !important; color: white; }
        .scan-deja { background: #ffc107 !important; color: #1a1d29; }
        .scan-erreur { background: #dc3545 !important; color: white; }

        /* Listes */
        .item-list { max-height: 300px; overflow-y: auto; margin-top: 15px; }
        .res-item, .film-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #222533; padding: 12px; margin-bottom: 8px;
            border-radius: 6px; border-left: 4px solid #e50914;
        }
        .res-item.venu { border-left-color: #27a745; opacity: 0.7; }
    </style>
</head>
<body>

    <h1>🎬 Panneau d'Administration Cinéma</h1>

    <div class="dashboard-grid">
        
        <section>
            <h2>🎟️ Contrôle des Tickets</h2>
            <div id="reader"></div>
            <div id="scanResult">Prêt à scanner...</div>
            
            <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav"></audio>
            <audio id="errorSound" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-84.wav"></audio>
            <audio id="warningSound" src="https://assets.mixkit.co/active_storage/sfx/911/911-84.wav"></audio>
        </section>

        <section>
            <h2 id="form-title">➕ Ajouter un Film</h2>
            <form id="filmForm">
                <input type="hidden" id="filmId">
                <input type="text" id="fNom" placeholder="Nom du film" required>
                <input type="text" id="fAffiche" placeholder="URL de l'affiche (Lien image)">
                <input type="text" id="fTrailer" placeholder="Lien YouTube de la bande-annonce">
                <input type="date" id="fDate" required>
                <input type="time" id="fHeure" required>
                <input type="number" id="fPlaces" placeholder="Nombre de places maximum (ex: 3)" defaultValue="3" required>
                <button type="submit" id="btnSubmitFilm">Créer la séance</button>
                <button type="button" id="btnCancelEdit" class="btn-orange" style="display:none;" onclick="resetFilmForm()">Annuler la modification</button>
            </form>

            <h3>Films programmés</h3>
            <div class="item-list" id="filmsList"></div>
        </section>

        <section>
            <h2>👥 Réservations Reçues</h2>
            <div class="item-list" id="resList"></div>
        </section>

    </div>

    <script>
        /* ========= CONFIG & INIT FIREBASE ========= */
        const firebaseConfig = {
            apiKey: "AIzaSyC8wGq8dQ5CM8YuCIm_b8yySYtrW4ylSm4",
            authDomain: "cafe-djoudi.firebaseapp.com",
            projectId: "cafe-djoudi",
            storageBucket: "cafe-djoudi.firebasestorage.app",
            appId: "1:812537096039:web:7f9b79b34454360b73b1c2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        /* ========= CONFIGURATION DU SCANNER DE QR CODES ========= */
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        
        html5QrcodeScanner.render((id) => {
            const resultDiv = document.getElementById('scanResult');
            
            db.collection("reservations").doc(id).get().then(doc => {
                if(doc.exists) {
                    const r = doc.data();
                    
                    if(r.venu === true) {
                        document.getElementById("warningSound").play();
                        resultDiv.innerText = `⚠️ DÉJÀ SCANNE : ${r.prenom} ${r.nom} est déjà entré !`;
                        resultDiv.className = "scan-deja";
                        return;
                    }

                    document.getElementById("successSound").play();
                    resultDiv.innerText = `✅ VALIDE : ${r.prenom} ${r.nom} (🍿 Snack: ${r.snack ? 'Oui' : 'Non'})`;
                    resultDiv.className = "scan-valide";

                    db.collection("reservations").doc(id).update({
                        venu: true,
                        timestamp: Date.now()
                    });

                } else {
                    document.getElementById("errorSound").play();
                    resultDiv.innerText = "❌ INCONNU : Ticket invalide ou falsifié !";
                    resultDiv.className = "scan-erreur";
                }
            }).catch(err => {
                console.error(err);
                resultDiv.innerText = "❌ Erreur de lecture Base de données";
                resultDiv.className = "scan-erreur";
            });
        });

        /* ========= CRÉATION ET MODIFICATION DE FILMS ========= */
        document.getElementById('filmForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('filmId').value;
            const filmData = {
                nom: document.getElementById('fNom').value,
                affiche: document.getElementById('fAffiche').value,
                trailer: document.getElementById('fTrailer').value,
                date: document.getElementById('fDate').value,
                heure: document.getElementById('fHeure').value,
                placesMax: parseInt(document.getElementById('fPlaces').value) || 3
            };

            if(id) {
                db.collection("films").doc(id).update(filmData).then(() => {
                    resetFilmForm();
                });
            } else {
                db.collection("films").add(filmData).then(() => {
                    document.getElementById('filmForm').reset();
                });
            }
        });

        function editFilm(id, nom, affiche, trailer, date, heure, placesMax) {
            document.getElementById('form-title').innerText = "📝 Modifier le Film";
            document.getElementById('filmId').value = id;
            document.getElementById('fNom').value = nom;
            document.getElementById('fAffiche').value = affiche === 'undefined' ? '' : affiche;
            document.getElementById('fTrailer').value = trailer === 'undefined' ? '' : trailer;
            document.getElementById('fDate').value = date;
            document.getElementById('fHeure').value = heure;
            document.getElementById('fPlaces').value = placesMax;
            
            document.getElementById('btnSubmitFilm').innerText = "Enregistrer les modifications";
            document.getElementById('btnCancelEdit').style.display = "block";
        }

        function resetFilmForm() {
            document.getElementById('form-title').innerText = "➕ Ajouter un Film";
            document.getElementById('filmId').value = "";
            document.getElementById('filmForm').reset();
            document.getElementById('btnSubmitFilm').innerText = "Créer la séance";
            document.getElementById('btnCancelEdit').style.display = "none";
        }

        function supprimerFilm(id) {
            if(confirm("Supprimer ce film définitivement ? cela n'effacera pas ses réservations.")) {
                db.collection("films").doc(id).delete();
            }
        }

        /* ========= SYNCHRONISATION EN TEMPS RÉEL DES COMPOSANTS ========= */
        db.collection("films").onSnapshot(snap => {
            const list = document.getElementById("filmsList");
            list.innerHTML = "";
            snap.forEach(doc => {
                const f = doc.data();
                const id = doc.id;
                list.innerHTML += `
                    <div class="film-item">
                        <span><b>${f.nom}</b> (${f.placesMax || 3} pl.)</span>
                        <div>
                            <button class="btn-sm btn-orange" onclick="editFilm('${id}', \`${f.nom}\`, '${f.affiche}', '${f.trailer}', '${f.date}', '${f.heure}', ${f.placesMax || 3})">✏️</button>
                            <button class="btn-sm btn-red" onclick="supprimerFilm('${id}')">🗑️</button>
                        </div>
                    </div>`;
            });
        });

        db.collection("reservations").orderBy("timestamp", "desc").onSnapshot(snap => {
            const list = document.getElementById("resList");
            list.innerHTML = "";
            snap.forEach(doc => {
                const r = doc.data();
                const id = doc.id;
                list.innerHTML += `
                    <div class="res-item ${r.venu ? 'venu' : ''}">
                        <span>
                            <b>${r.prenom} ${r.nom}</b> ${r.venu ? '📌 En Salle' : '⌛ En Attente'}<br>
                            <small>${r.film} — Snack: ${r.snack ? '🍿 Oui' : 'Non'}</small>
                        </span>
                        <div>
                            <button class="btn-sm btn-red" onclick="supprimerReservation('${id}', \`${r.film}\`)">🗑️</button>
                        </div>
                    </div>`;
            });
        });

        /* GESTION INTELLIGENTE FIFO DE LA LISTE D'ATTENTE */
        async function supprimerReservation(id, filmNom) {
            if(confirm("Supprimer la réservation définitivement ?")) {
                try {
                    // 1. Suppression de la place active
                    await db.collection("reservations").doc(id).delete();
                    
                    // 2. Recherche automatique du premier arrivé en attente pour CE film
                    const attenteSnap = await db.collection("liste_attente")
                                                 .where("film", "==", filmNom)
                                                 .orderBy("timestamp", "asc")
                                                 .limit(1)
                                                 .get();

                    if(!attenteSnap.empty) {
                        const premierDoc = attenteSnap.docs[0];
                        const client = premierDoc.data();

                        // 3. Bascule automatique dans la collection principale
                        await db.collection("reservations").add({
                            nom: client.nom,
                            prenom: client.prenom,
                            film: client.film,
                            snack: client.snack,
                            venu: false,
                            timestamp: Date.now() // Va notifier instantanément l'écran d'affichage
                        });

                        // 4. Retrait de la liste d'attente
                        await db.collection("liste_attente").doc(premierDoc.id).delete();
                        alert(`🎉 Place libérée ! ${client.prenom} ${client.nom} est repêché(e) automatiquement de la liste d'attente.`);
                    }
                } catch (err) {
                    console.error("Erreur liste d'attente : ", err);
                }
            }
        }
    </script>
</body>
</html>
